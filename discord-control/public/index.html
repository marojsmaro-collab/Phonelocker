<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Server Builder</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <meta name="theme-color" content="#111214" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login" class="overlay hidden">
    <form id="loginForm" class="login-card">
      <img class="logo" src="logo.png" alt="" />
      <h1>Server Builder</h1>
      <p class="muted">Enter your dashboard password</p>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit" class="btn primary">Let me in</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <nav id="rail" class="rail" aria-label="Servers"></nav>

    <div class="main">
      <header class="topbar">
        <div class="bot-id">
          <img id="botAvatar" alt="" />
          <div class="bot-text">
            <div id="botName" class="bot-name">Connecting…</div>
            <div id="botSub" class="muted small"></div>
          </div>
        </div>
        <div class="top-right">
          <span id="serverName" class="server-name"></span>
          <button id="togglePanel" class="btn ghost small" type="button" title="Server layout">📋</button>
        </div>
      </header>
      <nav id="tabs" class="tabs" role="tablist"></nav>
      <section id="view" class="view"></section>
    </div>

    <aside id="panel" class="panel">
      <div class="panel-head">
        <strong>Server layout</strong>
        <button id="refresh" class="btn ghost small" type="button" title="Refresh">↻</button>
      </div>
      <div id="layout" class="layout"></div>
    </aside>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
